name: CI-CD Pipe

on:
  push:
    branches:
      - deploy

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend
        run: docker build -t colacao666/backend:v2 ./backend

      - name: Build frontend
        run: docker build -t colacao666/frontend:v2 ./frontend

      - name: Push backend
        run: docker push colacao666/backend:v2

      - name: Push frontend
        run: docker push colacao666/frontend:v2
